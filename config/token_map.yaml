# framework -> surface -> token -> method id (or a list of ids) from data/methods.yaml.
# Tokens outside the scope get "~<family>" so they are recorded but excluded from analysis:
#   ~preexisting  behaviour the framework already had before the option got a name
#   ~config       plumbing, not an algorithm
#   ~preference ~distillation ~sft ~reward_model ~systems ~application ~diffusion ~multimodal
# New tokens show up in data/generated/unmapped.json until they are added here.

