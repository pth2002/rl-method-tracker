# Default values that switch a method on.
# framework -> default token -> value -> method id, or {method, condition} when the default only
# takes effect after another setting is changed from its own default (a conditional default).
_defaults:
  verl:
    adv_estimator: {gae: ppo, grpo: grpo}
    policy_loss_mode: {vanilla: ppo}
  trl:
    loss_type: {grpo: grpo, dr_grpo: dr_grpo, dapo: dapo_token_loss}
    vllm_importance_sampling_correction: {"True": {method: tis, condition: "use_vllm=True (default False)"}}
    mask_truncated_completions: {"True": dapo_overlong}
    importance_sampling_level: {sequence: gspo}
    use_bias_correction_kl: {"True": {method: unbiased_kl, condition: "beta != 0 (default 0)"}}
    beta: {"0.0": dapo_no_kl}
  openrlhf:
    adv_estimator: {gae: ppo, group_norm: grpo}
  slime:
    adv_estimator: {grpo: grpo}
  roll:
    adv_estimator: {gae: ppo, grpo: grpo}
