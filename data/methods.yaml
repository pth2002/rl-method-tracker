# Curated catalog of RL post-training methods tracked across frameworks.
#
# Scope: online RL for language models (policy-gradient family). Preference optimisation,
# distillation, SFT, systems features and task recipes are recorded in token_map.yaml as
# out-of-scope families, not here.
#
# source.arxiv is checked by collectors/papers.py against arXiv (title, authors, first version
# date). Entries without an arXiv id give `title` so the script can search for it; entries
# whose only public source is a blog give `url` and `date` by hand.
# `review: true` marks entries whose source attribution still needs a human check.
#
# Families: base, advantage, clipping, aggregation, sampling, length, offpolicy, moe, entropy, kl, multi_reward

# ---- Baselines (pre-2025 or the starting point) ----
- id: ppo
  name: PPO (clipped surrogate, GAE)
  source: {arxiv: "1707.06347"}
  family: base
  symptoms: []
- id: grpo
