# ---- Added by the citation audit (framework files cite the paper next to its implementation) ----
- id: trm
  name: Trust region masking (sequence max divergence)
  source: {arxiv: "2512.23075"}
  family: clipping
  symptoms: [train_infer_mismatch, stale_policy]
  note: verl rollout_rs values seq_max_k2 and seq_max_k3, added by a paper author in PR #4544; verl's rollout correction docs cite the paper.
- id: vapo
  name: VAPO (decoupled and length-adaptive GAE, positive-example NLL)
  source: {arxiv: "2504.05118"}
  family: advantage
  symptoms: [sparse_reward, length_bias]
  note: NeMo-RL options gae_lambda_value, gae_lambda_policy, length_adaptive_alpha and positive_example_nll_weight; the PPO guide cites the paper.
- id: papo
  name: PAPO (implicit perception loss)
  source: {arxiv: "2507.06448"}
  family: kl
  symptoms: []
  note: TRL experimental trainer added in PR #4334 and removed in PR #6235; listed in TRL's paper index.
- id: aent
  name: AEnt (clamped entropy bonus with adaptive coefficient)
  source: {arxiv: "2509.03493"}
  family: entropy
  symptoms: [entropy_collapse]
  note: AReaL recipe/AEnt, removed in a refactor on 2026-02-04.
- id: collabllm
  name: CollabLLM (multiturn-aware rewards)
  source: {arxiv: "2502.00640"}
  family: credit
  symptoms: []
  note: verl recipe and docs/algo/collabllm.md; the recipe later moved to verl-recipe.
- id: echo
  name: ECHO (auxiliary world-model loss on observation tokens)
  source: {arxiv: "2605.24517"}
  family: other
  symptoms: []
  note: verl-recipe echo/, which ports the official implementation.
- id: dler
  name: DLER truncation penalty
  source: {arxiv: "2510.15110"}
  family: length
  symptoms: [length_bias]
  note: NeMo-RL stop_properly_penalty_coef, added with the ProRLv2 recipe; the ProRLv2 guide cites DLER for this penalty.
- id: aepo
  name: AEPO (adaptive exploration policy optimisation)
  source: {arxiv: "2508.05731"}
  family: sampling
  symptoms: []
  note: verl recipe infigui-g1. The paper's main contribution is a GUI grounding model, so it is listed with the included papers outside the general rule.

- id: kl_grad_correction
  name: KL gradient with the score-function term (Tang and Munos)
  source: {arxiv: "2506.09477"}
  family: kl
  symptoms: []
  note: NeMo-RL fix of the KL backward pass (PR #2506) keeps the gradient through the sampling probability and cites the paper in the code. It applies whenever the KL penalty is non-zero, as in the base GRPO configuration. An earlier implementation behind a switch (PR #524) was withdrawn in 2025.

- id: starpo
  name: StarPO (trajectory-level optimisation for multi-turn agents, RAGEN)
  source: {arxiv: "2504.20073"}
  family: other
  symptoms: []
  note: ROLL's trajectory-wise agentic pipeline, present since its first public commit; ROLL's documentation names it StarPO and cites the RAGEN paper.

